name: ToyTalk
description: ToyTalk was a San Francisco conversational AI company founded in 2011 that built
  voice and chat characters for entertainment, rebranded as PullString in 2016, and was acquired
  by Apple in early 2019. Its developer platform - the PullString Web API plus Converse and Author
  tooling for authoring conversational experiences - was shut down after the acquisition. Today
  pullstring.com and toytalk.com no longer resolve and both domains are parked on Apple
  nameservers, the github.com/pullstring organization has been deleted, and the only surviving
  first-party developer artifact is the orphaned pullstring JavaScript SDK on npm. This profile
  records that historical developer surface; there is no live API.
